name: sample_vault
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/cover.png"
  web:
    generate: true
    image_path: "assets/cover.png"
    background_color: "#0F0F12"
    theme_color: "#8B5CF6"

flutter:
  uses-material-design: true
  assets:
    - assets/